# Start the heat when cold inside
- id: "0301"
  alias: Climate - Start heating when cold
  triggers:
    trigger: template
    value_template: "{{ states.sensor.downstairs_average_temperature.state | float < (states.input_number.living_room_hvac_target.state | float - 0.5 | float) }}"
    for:
      minutes: 30
  conditions:
    condition: state
    entity_id: climate.living_room_hvac
    state: "off"
  actions:
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.living_room_hvac
      data:
        hvac_mode: heat
    # Wait for the mode switch to actually land before pushing temperature/fan, otherwise the HVAC can apply them against the old mode
    - wait_template: "{{ states('climate.living_room_hvac') == 'heat' }}"
      timeout:
        seconds: 20
      continue_on_timeout: true
    - action: climate.set_temperature
      target:
        entity_id: climate.living_room_hvac
      data:
        temperature: "{{ states.input_number.living_room_hvac_target.state | float - states.input_number.living_room_hvac_offset.state | float }}"
    - delay:
        seconds: 5
    - action: climate.set_fan_mode
      target:
        entity_id: climate.living_room_hvac
      data:
        fan_mode: low

# Start the AC when warm inside, and vacation mode is off
- id: "0302"
  alias: Climate - Start cooling when warm
  triggers:
    trigger: template
    value_template: "{{ states.sensor.downstairs_average_temperature.state | float > (states.input_number.living_room_hvac_target.state | float + 0.5 | float) }}"
    for:
      minutes: 30
  conditions:
    - condition: state
      entity_id: climate.living_room_hvac
      state: "off"
    - condition: state
      entity_id: input_boolean.vacation_mode
      state: "off"
  actions:
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.living_room_hvac
      data:
        hvac_mode: cool
    # Wait for the mode switch to actually land before pushing temperature/fan, otherwise the HVAC can apply them against the old mode
    - wait_template: "{{ states('climate.living_room_hvac') == 'cool' }}"
      timeout:
        seconds: 20
      continue_on_timeout: true
    - action: climate.set_temperature
      target:
        entity_id: climate.living_room_hvac
      data:
        temperature: "{{ states.input_number.living_room_hvac_target.state | float + states.input_number.living_room_hvac_offset.state | float }}"
    - delay:
        seconds: 5
    - action: climate.set_fan_mode
      target:
        entity_id: climate.living_room_hvac
      data:
        fan_mode: auto

# Change HVAC temperature when target/offset changes, or whenever HVAC switches to heat (covers mode changes not made via 0301, e.g. manual)
- id: "0303"
  alias: Climate - Change temperature heat
  triggers:
    - trigger: state
      entity_id: input_number.living_room_hvac_target
    - trigger: state
      entity_id: input_number.living_room_hvac_offset
    - trigger: state
      entity_id: climate.living_room_hvac
      to: heat
  conditions:
    condition: state
    entity_id: climate.living_room_hvac
    state: heat
  actions:
    action: climate.set_temperature
    target:
      entity_id: climate.living_room_hvac
    data:
      temperature: "{{ states.input_number.living_room_hvac_target.state | float - states.input_number.living_room_hvac_offset.state | float }}"

# Change HVAC temperature when target/offset changes, or whenever HVAC switches to cool (covers mode changes not made via 0302, e.g. manual)
- id: "0304"
  alias: Climate - Change temperature cool
  triggers:
    - trigger: state
      entity_id: input_number.living_room_hvac_target
    - trigger: state
      entity_id: input_number.living_room_hvac_offset
    - trigger: state
      entity_id: climate.living_room_hvac
      to: cool
  conditions:
    condition: state
    entity_id: climate.living_room_hvac
    state: cool
  actions:
    action: climate.set_temperature
    target:
      entity_id: climate.living_room_hvac
    data:
      temperature: "{{ states.input_number.living_room_hvac_target.state | float + states.input_number.living_room_hvac_offset.state | float }}"

# Turn off the heat when warm inside, and the heat is on
- id: "0305"
  alias: Climate - Stop heating when warm
  triggers:
    trigger: template
    value_template: "{{ states.sensor.downstairs_average_temperature.state | float > (states.input_number.living_room_hvac_target.state | float + 0.5 | float) }}"
    for:
      minutes: 15
  conditions:
    condition: state
    entity_id: climate.living_room_hvac
    state: heat
  actions:
    action: climate.turn_off
    target:
      entity_id: climate.living_room_hvac

# Turn off the AC when cold inside, and the AC is on
- id: "0306"
  alias: Climate - Stop cooling when cold
  triggers:
    trigger: template
    value_template: "{{ states.sensor.downstairs_average_temperature.state | float < (states.input_number.living_room_hvac_target.state | float - 0.5 | float) }}"
    for:
      minutes: 15
  conditions:
    condition: state
    entity_id: climate.living_room_hvac
    state: cool
  actions:
    action: climate.turn_off
    target:
      entity_id: climate.living_room_hvac

# Report external temperature to bedroom radiator
- id: "0307"
  alias: Climate - Report bedroom external temp
  triggers:
    - trigger: state
      entity_id: sensor.bedroom_temperature
    - trigger: time_pattern
      minutes: "/5"
  actions:
    action: number.set_value
    data:
      entity_id: number.bedroom_radiator_external_temperature
      value: "{{ states('sensor.bedroom_temperature') | float * 100 }}"

# Report external temperature to Lovelia's room radiator
- id: "0308"
  alias: Climate - Report Lovelia's room external temp
  triggers:
    - trigger: state
      entity_id: sensor.lovelias_room_temperature
    - trigger: time_pattern
      minutes: "/5"
  actions:
    action: number.set_value
    data:
      entity_id: number.lovelias_room_radiator_external_temperature
      value: "{{ states('sensor.lovelias_room_temperature') | float * 100 }}"

# Notify when the HVAC dust filter has reached its wear threshold, with a one-tap reset
- id: "0309"
  alias: Climate - Notify on HVAC dust filter wear warning
  triggers:
    trigger: state
    entity_id: binary_sensor.hvac_dust_filter_wear
    to: "on"
  actions:
    action: notify.home_mobile_apps
    data:
      title: "HalloNET Home"
      message: "HVAC dust filter needs cleaning: {{ states('sensor.hvac_dust_filter_runtime_since_reset') }} h used, threshold at {{ states('select.hvac_dust_filter_alarm_threshold') }} h"
      data:
        channel: Climate
        actions:
          - action: reset_hvac_dust_filter
            title: "Reset filter"

# Reset the HVAC dust filter runtime when the reset button is pressed
- id: "0310"
  alias: Climate - Reset HVAC dust filter runtime
  triggers:
    trigger: state
    entity_id: input_button.hvac_dust_filter_reset
  actions:
    action: utility_meter.reset
    target:
      entity_id: sensor.hvac_dust_filter_runtime_since_reset
