# Notify home members when the lawn mower reports an error
- id: "1301"
  alias: Gardening - Notify on lawn mower error
  triggers:
    trigger: state
    entity_id: binary_sensor.outdoor_lawn_mower_error
    to: "on"
  actions:
    action: notify.home_mobile_apps
    data:
      title: "HalloNET Home"
      message: "Lawn mower error: {{ state_attr('binary_sensor.outdoor_lawn_mower_error', 'error_message') }}"
      data:
        channel: Gardening

# Turn off the side LED once the mower finishes for the day and returns to the dock
- id: "1302"
  alias: Gardening - Turn off lawn mower side LED when docked
  triggers:
    trigger: state
    entity_id: lawn_mower.outdoor_lawn_mower
    to: "docked"
  actions:
    action: switch.turn_off
    target:
      entity_id: switch.outdoor_lawn_mower_side_led
