# Send a reminder when garbage collection is tomorrow
- id: "0803"
  alias: Reminder - Garbage Collection
  triggers:
    - trigger: time
      at: "08:00:00"
    - trigger: time
      at: "20:00:00"
  conditions:
    condition: template
    value_template: >
      {{ state_attr('binary_sensor.garbage_collection', 'has_tomorrow') | bool }}
  actions:
    action: notify.home_mobile_apps
    data:
      title: "HalloNET Home"
      message: "Collection of {{ state_attr('binary_sensor.garbage_collection', 'tomorrow_message') }}."
      data:
        channel: Reminder
